# Entitäten aus Teil A2. Feldnamen aus der Microsoft-Doku, Stand 23.10.2026.
# Entityset-Namen stehen so in den GET-Seiten.
# filter_field ist das Feld für $filter. null bedeutet: kein Datumsfilter.
# key ist der Zeilenschlüssel. null nur bei Analytics dimensions
# (Shortcut-Dimensionen 1 bis 8, eine Zeile, kein einzelner Schlüssel).
#
# Nicht enthalten, weil nicht in Teil A2: dateSetup.
# Nicht enthalten: incomeStmtGeneralLedgerEntries (zweiter Name neben der langen Form).
# GuV-Posten nutzen accountNo. Bilanz- und Abschlussposten nutzen glAccountNo.
# Debitoren- und Kreditorenzeilen sind Detailed-Posten.

v2.0:
  - entity_set: generalLedgerEntries
    select:
      - id
      - entryNumber
      - postingDate
      - documentNumber
      - documentType
      - accountId
      - accountNumber
      - description
      - debitAmount
      - creditAmount
      - additionalCurrencyDebitAmount
      - additionalCurrencyCreditAmount
      - lastModifiedDateTime
    filter_field: postingDate
    key: id

  - entity_set: trialBalances
    select:
      - accountId
      - number
      - accountType
      - display
      - totalDebit
      - totalCredit
      - balanceAtDateDebit
      - balanceAtDateCredit
      - dateFilter
    filter_field: dateFilter
    # OData-Schlüssel ist accountId. number ist die Kontonummer für die Abstimmung.
    key: accountId

  - entity_set: accounts
    select:
      - id
      - number
      - displayName
      - category
      - subCategory
      - blocked
      - accountType
      - directPosting
      - netChange
      - consolidationTranslationMethod
      - consolidationDebitAccount
      - consolidationCreditAccount
      - excludeFromConsolidation
      - lastModifiedDateTime
    filter_field: null
    key: id

  - entity_set: dimensions
    select:
      - id
      - code
      - displayName
      - consolidationCode
      - lastModifiedDateTime
    filter_field: null
    key: id

  - entity_set: dimensionValues
    select:
      - id
      - code
      - dimensionId
      - displayName
      - consolidationCode
      - lastModifiedDateTime
    filter_field: null
    key: id

  - entity_set: customers
    select:
      - id
      - number
      - displayName
      - type
      - addressLine1
      - addressLine2
      - city
      - state
      - country
      - postalCode
      - phoneNumber
      - email
      - website
      - salespersonCode
      - balanceDue
      - creditLimit
      - taxLiable
      - taxAreaId
      - taxAreaDisplayName
      - taxRegistrationNumber
      - currencyId
      - currencyCode
      - paymentTermsId
      - shipmentMethodId
      - paymentMethodId
      - blocked
      - lastModifiedDateTime
    filter_field: null
    key: id

  - entity_set: vendors
    select:
      - id
      - number
      - displayName
      - addressLine1
      - addressLine2
      - city
      - state
      - country
      - postalCode
      - phoneNumber
      - email
      - website
      - taxRegistrationNumber
      - currencyId
      - currencyCode
      - irs1099Code
      - paymentTermsId
      - paymentMethodId
      - taxLiable
      - blocked
      - balance
      - lastModifiedDateTime
    filter_field: null
    key: id

  - entity_set: items
    select:
      - id
      - number
      - displayName
      - displayName2
      - type
      - itemCategoryId
      - itemCategoryCode
      - blocked
      - gtin
      - inventory
      - unitPrice
      - priceIncludesTax
      - unitCost
      - taxGroupId
      - taxGroupCode
      - baseUnitOfMeasureId
      - baseUnitOfMeasureCode
      - generalProductPostingGroupId
      - generalProductPostingGroupCode
      - inventoryPostingGroupId
      - inventoryPostingGroupCode
      - lastModifiedDateTime
    filter_field: null
    key: id

  - entity_set: itemCategories
    select:
      - id
      - code
      - displayName
      - lastModifiedDateTime
    filter_field: null
    key: id


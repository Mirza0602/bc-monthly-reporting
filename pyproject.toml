[project]
name = "bc-monthly-reporting"
version = "0.1.0"
description = "Monthly reporting from Business Central, reconciled to the general ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mirza Imamovic", email = "mail@mirza-data.de" }]
dependencies = [
    "requests",
    "msal",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "pytest",
    "ruff",
    "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
